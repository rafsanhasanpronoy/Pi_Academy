<div class="{% if full %}md:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="block text-sm font-bold mb-1.5">
    {{ field.label }}{% if field.field.required %} <span class="text-brand">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs text-muted mt-1">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}
  <p class="text-xs text-brand mt-1 font-semibold">{{ error }}</p>
  {% endfor %}
</div>
